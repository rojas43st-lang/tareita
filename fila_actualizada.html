<tbody id="producto-{{ producto.id }}">

    <tr>

        <td colspan="6">

            <div class="success">
                Producto actualizado correctamente.
            </div>

        </td>

    </tr>

    <tr>

        <td>
            {{ producto.id }}
        </td>

        <td>
            {{ producto.nombre }}
        </td>

        <td>
            {{ producto.precio }}
        </td>

        <td>
            {{ producto.cantidad }}
        </td>

        <td>
            {{ producto.descripcion or "" }}
        </td>

        <td>

            <button
                hx-get="/productos/{{ producto.id }}/editar"
                hx-target="#producto-{{ producto.id }}"
                hx-swap="outerHTML"
            >
                Editar
            </button>

        </td>

    </tr>

</tbody>
